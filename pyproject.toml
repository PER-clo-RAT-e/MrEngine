#:tombi schema.strict = false
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MrEngine"
version = "0.1-10"
description = "Engine for my (and not only mine) terminal games"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "PER-clo-RAT-e" }
]

dependencies = [
    "blessed>=1.49.0",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "pygls>=2.1.1",
    "readchar>=4.2.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-psprj",
    "tree-sitter-uiscm",
]

[project.scripts]
ui-builder = "ui_builder.main:main"
mr-sweep-old = "client.main_old:main"
mr-sweep = "client.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/client"]


[tool.hatch.envs.default]
installer="uv"
path=".venv"

[tool.uv.workspace]
members = [
    "src/parsers/tree-sitter-uiscm",
    "src/parsers/tree-sitter-psprj",
]

[tool.uv.sources]
tree-sitter-uiscm = { workspace = true }
tree-sitter-psprj = { workspace = true }
