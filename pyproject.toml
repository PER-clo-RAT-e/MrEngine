#:tombi schema.strict = false
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MrSweep"
version = "0.0-00"
description = "Simple minesweeper"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PER-clo-RAT-e" }
]

dependencies = [
    "blessed>=1.49.0",
]

[project.scripts]
mr-sweep = "game.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/game"]


[tool.hatch.envs.default]
installer="uv"
path=".venv"
